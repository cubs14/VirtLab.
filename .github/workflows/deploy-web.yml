name: Deploy VirtLab a GitHub Pages

# Se ejecuta cada vez que subís/cambiás algo en la rama main
# (por ejemplo, cuando subís o reemplazás el ZIP del sitio).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el ZIP del sitio
        run: |
          set -e
          mkdir -p site

          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "Encontrado ZIP: $ZIP_FILE -> descomprimiendo en ./site"
            unzip -o "$ZIP_FILE" -d site
          else
            echo "No se encontró ningún .zip, copiando los archivos sueltos del repo"
            rsync -a --exclude='site' --exclude='.git' --exclude='.github' ./ site/
          fi

          echo "Contenido final que se va a publicar:"
          find site -maxdepth 2

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar artefacto para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
