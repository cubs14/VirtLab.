name: Compilar Web (zip listo para Netlify)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar la carpeta web/ del proyecto (si no existe)
        run: |
          if [ ! -d "web" ]; then
            flutter create --platforms=web --org com.panny --project-name labi .
          fi

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar versión web (ruta raíz, para Netlify)
        run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=APPWRITE_API_KEY=${{ secrets.APPWRITE_API_KEY }}

      - name: Subir build/web como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: virtlab-web-listo
          path: build/web
          retention-days: 14