name: Build VirtLab Web for Netlify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web:
    name: Build VirtLab Web
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar versiones
        run: |
          flutter --version
          dart --version

      - name: Habilitar Flutter Web
        run: flutter config --enable-web

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analizar proyecto
        run: flutter analyze

      - name: Preparar Firebase Web
        run: |
          if [ ! -f web/firebase-messaging-sw.js ]; then
            echo "No existe firebase-messaging-sw.js"
          else
            echo "Firebase Messaging Web encontrado"
          fi

      - name: Compilar VirtLab Web
        run: |
          flutter build web \
            --release \
            --base-href "/"

      - name: Verificar compilación
        run: |
          test -f build/web/index.html
          test -d build/web/assets

          echo "===================================="
          echo "VirtLab Web compilado correctamente"
          echo "===================================="

          du -sh build/web
          find build/web -maxdepth 2 -type f | head -100

      - name: Crear ZIP para Netlify
        run: |
          cd build/web
          zip -r ../../virtlab-web-netlify.zip .

      - name: Verificar ZIP
        run: |
          test -f virtlab-web-netlify.zip

          echo "===================================="
          echo "ZIP generado:"
          echo "virtlab-web-netlify.zip"
          echo "===================================="

          ls -lh virtlab-web-netlify.zip

      - name: Subir ZIP como artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtlab-web-netlify
          path: virtlab-web-netlify.zip
          if-no-files-found: error
          retention-days: 30
