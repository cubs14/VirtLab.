name: Deploy VirtLab Web (Netlify)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Descomprimir virtlab_flutter.zip si lo subiste tal cual
        run: |
          if [ -f "virtlab_flutter.zip" ]; then
            unzip -o virtlab_flutter.zip -d _extracted
            cp -r _extracted/virtlab_flutter/. .
            rm -rf _extracted virtlab_flutter.zip
          elif [ -d "virtlab_flutter" ]; then
            cp -r virtlab_flutter/. .
            rm -rf virtlab_flutter
          fi

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar la carpeta web/ del proyecto (si no existe)
        run: |
          if [ ! -d "web" ]; then
            flutter create --platforms=web --org com.panny --project-name labi .
          fi

      - name: Redirección para que Netlify sirva bien la app (SPA)
        run: echo "/*    /index.html   200" > web/_redirects

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar versión web (raíz "/", para Netlify)
        run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --dart-define=CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }} \
            --dart-define=APPWRITE_API_KEY=${{ secrets.APPWRITE_API_KEY }}

      - name: Publicar en Netlify
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: 'build/web'
          production-deploy: true
          deploy-message: "Deploy automático desde GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
          enable-github-deployment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
